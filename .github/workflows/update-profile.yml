name: Refresh profile
on:
  schedule:
    - cron: "23 9 * * *"   # daily, UTC
  push:
    branches: [main]
    paths: ["tools/profile/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/profile/requirements.txt
      - run: pip install -r tools/profile/requirements.txt
      - run: python tools/profile/fetch.py
        env:
          # Optional PAT (read:user) so private contributions count, as on your profile graph.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: python tools/profile/render.py
      - run: python tools/profile/readme.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/profile/data README.md
          git diff --cached --quiet || (git commit -m "Refresh profile stats" && git push)
